<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国历史朝代脉络全景</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#FBFAF7; font-family:'PingFang SC','Microsoft YaHei',sans-serif; color:#1A1B1C; }
.title-bar {
  position:fixed; top:0; left:0; right:0; z-index:100;
  background:#FBFAF7; border-bottom:1px solid #E4E3DD;
  padding:10px 16px; text-align:center;
}
.title-bar h1 { font-size:17px; }
.title-bar .sub { font-size:11px; color:#6B7280; margin-top:2px; }
.body { padding-top:64px; }

.layout { display:flex; }
.col-name { width:76px; flex-shrink:0; position:sticky; left:0; background:#FBFAF7; z-index:10; border-right:1px solid #E4E3DD; }
.col-scroll { flex:1; overflow-x:auto; -webkit-overflow-scrolling:touch; position:relative; }
.col-inner { min-width:680px; position:relative; padding-right:20px; }

.year-divider { position:absolute; top:0; bottom:0; width:0; border-left:1px dashed #C0504D; box-shadow:0 0 2px rgba(192,80,77,0.3); z-index:1; }
.ref-line { position:absolute; top:0; bottom:0; width:0; border-left:1px dashed rgba(0,0,0,0.12); z-index:0; }
.ref-line-label { position:absolute; top:4px; font-size:9px; color:#999; transform:translateX(4px); white-space:nowrap; }
.year-divider-label { position:absolute; top:4px; font-size:10px; color:#C0504D; font-weight:600; transform:translateX(6px); white-space:nowrap; }

.dyn-row { height:38px; border-bottom:1px solid rgba(0,0,0,0.04); position:relative; cursor:pointer; display:flex; align-items:center; }
.dyn-name { font-size:12px; font-weight:600; text-align:right; padding-right:8px; width:76px; flex-shrink:0; background:#FBFAF7; }
.dyn-bar-wrap { flex:1; position:relative; height:24px; display:flex; align-items:center; }
.dyn-bar { position:absolute; height:18px; border-radius:3px; opacity:0.88; }
.dyn-bar-label { position:absolute; font-size:9.5px; color:#1A1B1C; white-space:nowrap; padding-left:4px; line-height:16px; }
.dyn-row.active .dyn-bar { opacity:1; outline:2px solid #1A1B1C; outline-offset:1px; }

.wrap-fade { position:relative; }
.wrap-fade::after {
  content:''; position:absolute; top:0; right:0; bottom:0; width:24px;
  background:linear-gradient(to left, #FBFAF7, transparent);
  pointer-events:none; z-index:5;
}

.tag { display:inline-block; padding:1px 6px; border-radius:3px; font-size:10px; font-weight:600; }
.t-zheng { background:#d4edda; color:#155724; }
.t-chuan { background:#ffe5cc; color:#8a4b00; }
.t-yanyi { background:#e9d8f4; color:#5b2a86; }
.t-cunyi { background:#f8d7da; color:#721c24; }

.float-legend {
  position:fixed; right:12px; top:70px; z-index:400;
  background:rgba(255,255,255,0.95); border:1px solid #E4E3DD; border-radius:8px;
  padding:8px 12px; font-size:11px; color:#6B7280; line-height:1.9;
  box-shadow:0 2px 8px rgba(0,0,0,0.08); max-width:210px;
}
.float-legend b { color:#1A1B1C; font-size:11px; }
.float-legend .tag { margin:0 3px 0 0; font-size:10px; padding:0 5px; }

.panel { display:none; padding:14px 18px; background:#fff; border:1px solid #E4E3DD; border-radius:10px; margin:6px 0 10px 0; font-size:13.5px; line-height:1.75; }
.panel.open { display:block; }
.panel-head { position:relative; }
.panel h2 { margin:0 0 6px; font-size:18px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.badge { color:#fff; padding:2px 10px; border-radius:10px; font-size:12px; font-weight:400; }
.meta { color:#374151; margin:4px 0 10px; padding-bottom:8px; border-bottom:1px dashed #E4E3DD; }
.rulers { margin:8px 0; padding-left:6px; }
.ruler { margin:6px 0; padding:6px 8px 6px 14px; background:#fafafa; border-radius:6px; border-left:3px solid #C0504D; position:relative; }
.ruler:not(:last-child)::after { content:"↓"; position:absolute; left:7px; bottom:-13px; font-size:10px; color:#C0504D; opacity:0.4; z-index:1; }
.ruler-name { font-weight:600; color:#1A1B1C; }
.reign { font-weight:400; font-size:11px; color:#6B7280; margin-left:8px; }
.ruler-deeds { margin-top:3px; color:#374151; font-size:13px; }
.ruler.collapsed { background:transparent; border-left-color:#ccc; border-left-style:dashed; }
.ruler.collapsed .ruler-name { font-weight:500; color:#666; }
.ruler.collapsed .ruler-deeds { color:#888; font-size:12.5px; }
.ruler-note { margin-top:2px; font-size:12.5px; color:#6B7280; font-style:italic; }
.section { margin-top:14px; padding-top:10px; border-top:1px dashed #E4E3DD; }
.section-title { font-weight:700; color:#3D7A5F; font-size:14px; margin-bottom:6px; }
.story { margin:4px 0; padding:4px 0; border-bottom:1px dotted #eee; cursor:pointer; }
.story:last-child { border-bottom:none; }
.story-name { font-weight:600; color:#1A1B1C; }
.story-tag { display:inline-block; padding:0 6px; border-radius:3px; font-size:10px; font-weight:600; margin-left:6px; vertical-align:middle; }
.s-zheng { background:#d4edda; color:#155724; }
.s-chuan { background:#ffe5cc; color:#8a4b00; }
.s-yanyi { background:#e9d8f4; color:#5b2a86; }
.s-cunyi { background:#f8d7da; color:#721c24; }
.story-desc { display:none; margin-top:4px; padding:6px 10px; background:#fafafa; border-radius:6px; font-size:12.5px; color:#555; line-height:1.6; }
.story.open .story-desc { display:block; }

.story-type { display:inline-block; padding:0 5px; border-radius:3px; font-size:9px; font-weight:600; margin-left:4px; vertical-align:middle; }
.t-politics { background:#dbeafe; color:#1e40af; }
.t-military { background:#fee2e2; color:#991b1b; }
.t-econ { background:#fef3c7; color:#92400e; }
.t-culture { background:#d1fae5; color:#065f46; }
.t-idiom { background:#ede9fe; color:#5b21b6; }
.story-meta { font-size:10px; color:#888; margin-left:6px; }

.story-arrow { display:inline-block; font-size:10px; color:#999; margin-right:4px; transition:transform .2s; }
.story.open .story-arrow { transform:rotate(90deg); }
#overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:900; }
#overlay.show { display:block; }
body.locked { overflow:hidden; }
.panel-close { display:none; }

@media (min-width:641px){
  .panel.open {
    position:fixed; top:0; right:0; bottom:0; width:440px; max-width:45vw;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    border-radius:0; border:1px solid #E4E3DD; border-left:1px solid #ddd;
    z-index:1000; margin:0; padding:0;
    box-shadow:-4px 0 24px rgba(0,0,0,0.15); background:#fff !important;
    animation:slideIn .25s ease-out;
  }
  @keyframes slideIn { from{ transform:translateX(100%); } to{ transform:translateX(0); } }
  .panel.open .panel-head { position:sticky; top:0; background:#fff; z-index:5; padding:14px 18px 10px; border-bottom:1px solid #eee; }
  .panel.open .panel-body { padding:4px 18px 28px; }
  .panel-close { display:block; position:absolute; top:10px; right:14px; width:30px; height:30px; line-height:28px; text-align:center; border-radius:50%; background:#f0f0f0; cursor:pointer; font-size:16px; color:#666; z-index:10; }
}

@media (max-width:640px){
  .panel.open {
    position:fixed; left:0; right:0; bottom:0;
    max-height:75vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    border-radius:16px 16px 0 0; border:1px solid #E4E3DD; border-bottom:none;
    z-index:1000; margin:0; padding:0;
    box-shadow:0 -4px 24px rgba(0,0,0,0.2); background:#fff !important;
  }
  .panel.open .panel-head { position:sticky; top:0; background:#fff; z-index:5; padding:14px 18px 10px; border-bottom:1px solid #eee; }
  .panel.open .panel-body { padding:4px 18px 28px; position:relative; }
    .panel.open .panel-body::after { content:''; position:sticky; bottom:0; left:0; right:0; height:30px; background:linear-gradient(transparent, #fff); pointer-events:none; }
  .panel-close { display:block; position:absolute; top:10px; right:14px; width:30px; height:30px; line-height:28px; text-align:center; border-radius:50%; background:#f0f0f0; cursor:pointer; font-size:16px; color:#666; z-index:10; }
}
</style>
</head>

     ],
     stories:[
       {name:'大禹治水',tag:'古史传说',type:'culture',era:'舜/禹时代·约前2000年',desc:'禹父子两代治水，禹改堵为疏，十三年走遍九州，三过家门而不入。《史记》有载，但具体细节已不可考。'},

       {name:'神农尝百草',tag:'古史传说',type:'culture',era:'传说时代',desc:'传说神农氏一日遇七十二毒，尝百草辨药性，是中华医药的起源神话。'}

    {n:'商',s:-1600,e:-1046,c:'#D4A574',cap:'亳 → 殷（今河南安阳）',years:'约554年',

       {name:'纣（帝辛）',reign:'约公元前1100—前1046年（在位约30年）',deeds:'末代君主，穷兵黩武，宠妲己，设炮烙之刑，比干强谏被剖心；牧野之战败于周武王，商亡。'}
     ],
     stories:[
       {name:'盘庚迁殷',tag:'正史',type:'politics',era:'商盘庚·约前1300年',desc:'盘庚不顾贵族反对迁都于殷（今安阳小屯），此后270余年不再迁都，商朝国力回升。殷墟甲骨文即出自此处。'},
       {name:'酒池肉林',tag:'正史',type:'idiom',era:'商纣·约前1100年',desc:'《史记》载商纣以酒为池、悬肉为林，与妲己裸逐其间。是后世暴君的标准形象，但具体细节可能有周人渲染。'},

       {name:'周公吐哺',tag:'正史',type:'politics',era:'周公旦·西周初',desc:'周公"一沐三捉发，一饭三吐哺"，唯恐失去天下贤士。曹操《短歌行》"周公吐哺，天下归心"即用此典。'},
       {name:'烽火戏诸侯',tag:'存疑',type:'politics',era:'周幽王·前779年',desc:'《史记》载幽王举烽火骗诸侯赶来博褒姒一笑。但清华简《系年》无此事，现代学者多认为是战国时人编造。'},
       {name:'道路以目',tag:'正史',type:'politics',era:'周厉王·前841年',desc:'周厉王时国人不敢言，路上相遇只敢眼神交流。召公谏"防民之口甚于防川"，最终引发国人暴动。'},
       {name:'老马识途',tag:'正史',type:'idiom',era:'齐桓公·前663年',desc:'齐桓公北伐孤竹，迷路，管仲放老马随行，遂得道。比喻有经验者能指引方向。'},
       {name:'分封制',tag:'正史',type:'politics',era:'西周初·前1046年起',desc:'周天子将土地人民分封给宗亲、功臣，建立诸侯国，以拱卫王室。是西周立国的根本制度，也是后来春秋战国诸侯割据的制度根源。'},
       {name:'宗法制',tag:'正史',type:'politics',era:'西周初·前1046年起',desc:'以嫡长子继承制为核心，区分大宗小宗，确定贵族等级继承权。与分封制互为表里，奠定中国三千年来宗族社会的基本结构。'},
       {name:'礼乐制度',tag:'正史',type:'culture',era:'周公旦·西周初',desc:'周公旦制定吉、凶、军、宾、嘉五礼和与之配套的乐舞，不同等级使用不同规格。孔子毕生维护的周礼即此，是儒家思想的源头。'}
     ],books:[{name:'周易（易经）',author:'西周卜官',period:'西周初',life:'传说',desc:'群经之首，以八卦推演天地人事，影响中国哲学三千年。'},{name:'诗经',author:'春秋前结集',period:'春秋中期',life:'传说',desc:'中国最早诗歌总集，收西周至春秋民歌305篇。'},{name:'尚书',author:'上古档案汇编',period:'春秋前',life:'传说',desc:'中国最早历史文献汇编，记载尧舜至商周政事。'}]},

     stories:[
       {name:'退避三舍',tag:'正史',type:'military',era:'晋文公·前632年',desc:'晋文公重耳流亡楚时承诺：若晋楚交战，晋军退避三舍（九十里）。后城濮之战果真退避，既兑现承诺又诱敌深入。'},
       {name:'一鸣惊人',tag:'正史',type:'politics',era:'楚庄王·前613年',desc:'楚庄王即位三年不理政事，后一日而罢昏、一日而称霸。比喻平时默默无闻，突然做出惊人成绩。'},
       {name:'卧薪尝胆',tag:'存疑',type:'idiom',era:'越王勾践·约前490年',desc:'越王勾践战败后卧薪尝胆二十年，终灭吴。但"卧薪"细节到汉代才出现，《左传》《国语》未载。'},
       {name:'围魏救赵',tag:'正史',type:'military',era:'齐孙膑·前354年',desc:'战国时魏围赵都邯郸，孙膑不直接救赵，而是直攻魏都，魏军回师途中在桂陵被齐军伏击。是经典的"批亢捣虚"战术。'},
       {name:'完璧归赵',tag:'正史',type:'idiom',era:'蔺相如·前283年',desc:'蔺相如带和氏璧使秦，识破秦王无割城之意，完璧归赵。后因功与廉颇不和，引发"将相和"。'},
       {name:'负荆请罪',tag:'正史',type:'idiom',era:'廉颇/蔺相如·前279年',desc:'廉颇不服蔺相如位在己上，蔺相如以国家大局避让。廉颇醒悟，赤裸上身背荆条登门谢罪，两人成为刎颈之交。'},
       {name:'纸上谈兵',tag:'正史',type:'military',era:'赵括·前260年',desc:'赵括熟读兵书却不会应变，长平之战被白起坑杀四十万赵卒。比喻空谈理论不能解决实际问题。'},
       {name:'图穷匕见',tag:'正史',type:'politics',era:'荆轲·前227年',desc:'荆轲献燕督亢地图于秦王，图穷而匕首见，刺杀未遂。是战国末年最著名的刺秦事件。'},
       {name:'商鞅变法',tag:'正史',type:'politics',era:'秦孝公·前356年',desc:'秦孝公任用商鞅，废井田开阡陌、奖励耕战、行郡县、连坐之法。秦国由此从西陲弱国一跃成为战国最强，为秦始皇统一奠定制度基础。'},
       {name:'百家争鸣',tag:'正史',type:'culture',era:'战国·前475—前221年',desc:'战国时期儒、墨、道、法、名、兵、阴阳等诸子百家并行，著书讲学、互相辩难。是中国思想史上最自由活跃的时期，后世思想流派几乎都可追溯至此。'}
     ],books:[{name:'春秋',author:'孔子修订',period:'春秋末期',life:'孔子（前551—前479）修订',desc:'中国第一部编年体史书，鲁国历史，微言大义。'},{name:'左传',author:'左丘明',period:'战国初期',life:'约前502—前422',desc:'《春秋》三传之一，先秦叙事散文巅峰。'},{name:'论语',author:'孔子弟子及再传弟子',period:'战国初期',life:'前551—前479',desc:'记录孔子言行，儒家核心经典，四书之一。'},{name:'道德经',author:'老子',period:'春秋末期',life:'约前571—前471',desc:'道家开山之作，仅五千言，影响中国哲学与宗教。'},{name:'孙子兵法',author:'孙武',period:'春秋末期',life:'约前545—前470',desc:'世界最早兵书，十三篇，至今为各国军校教材。'},{name:'孟子',author:'孟子及其弟子',period:'战国中期',life:'约前372—前289',desc:'儒家四书之一，性善论与仁政思想。'},{name:'庄子',author:'庄周',period:'战国中期',life:'约前369—前286',desc:'道家代表作，寓言汪洋恣肆，文学与哲学双绝。'},{name:'韩非子',author:'韩非',period:'战国末期',life:'约前280—前233',desc:'法家集大成之作，秦制理论基础。'},{name:'楚辞',author:'屈原、宋玉等',period:'战国末期',life:'屈原（约前340—前278）、宋玉等',desc:'中国浪漫主义诗歌源头，《离骚》为代表作。'}]},

       {name:'秦二世（胡亥）',reign:'公元前210—前207年（在位3年）',deeds:'赵高弄权，"指鹿为马"；陈胜吴广大泽乡起义，天下响应。'},

       {name:'指鹿为马',tag:'正史',type:'politics',era:'赵高/秦二世·前207年',desc:'赵高献鹿于二世，曰"马"。问群臣，沉默或说是马者多，说是鹿者被赵高暗中陷害。比喻故意颠倒黑白。'},
       {name:'焚书坑儒',tag:'正史',type:'culture',era:'秦始皇·前213年',desc:'秦始皇采纳李斯建议焚民间诗书，后坑杀非议朝政的方士儒生四百余人。是中国文化史上第一次大规模思想整顿。'},

     stories:[

       {name:'约法三章',tag:'正史',type:'politics',era:'刘邦·前206年',desc:'刘邦入咸阳，与父老约法三章：杀人者死，伤人及盗抵罪。废除秦苛法，深得民心。'},
       {name:'成也萧何败也萧何',tag:'正史',type:'idiom',era:'萧何/韩信·前196年',desc:'萧何月下追韩信荐为大将；后又与吕后定计杀韩信于长乐钟室。比喻事情的成败都由同一个人造成。'},
       {name:'金屋藏娇',tag:'正史',type:'idiom',era:'汉武帝·前153年',desc:'汉武帝幼时说若得阿娇为妇，当造金屋贮之。后娶陈阿娇为皇后。今多作纳妾戏称。'},
       {name:'苏武牧羊',tag:'正史',type:'politics',era:'苏武·前100年',desc:'苏武出使匈奴被扣十九年，在北海（今贝加尔湖）持汉节牧羊，节旄尽落仍不屈。是民族气节的象征。'},
       {name:'桃李不言下自成蹊',tag:'正史',type:'culture',era:'司马迁评李广·前1世纪',desc:'司马迁评李广："桃李不言，下自成蹊。"比喻为人真诚自能感召他人。'},
       {name:'推恩令',tag:'正史',type:'politics',era:'汉武帝·前127年',desc:'汉武帝采纳主父偃建议，令诸侯王除嫡长子外，其余子弟也可分割封地为侯国。表面是施恩，实则使大国自动拆成小国，不费一兵一卒解决了汉初诸侯威胁中央的问题。'},
       {name:'独尊儒术',tag:'正史',type:'culture',era:'汉武帝·前134年',desc:'汉武帝采纳董仲舒建议，罢黜百家、设五经博士、办太学。儒学自此成为官方意识形态，影响中国两千年的选官、教育与政治伦理。'},
       {name:'盐铁专营',tag:'正史',type:'econ',era:'汉武帝·前119年',desc:'汉武帝将盐、铁收归官营，设盐官铁官垄断生产销售，为对匈奴战争筹集军费。是中国历史上第一次大规模国家垄断经济，后世盐、茶专卖制度的源头。'},
       {name:'刺史制度',tag:'正史',type:'politics',era:'汉武帝·前106年',desc:'汉武帝将全国分为十三州，派刺史巡察地方郡守与豪强。刺史品级低但可直达皇帝，是中国最早的系统监察制度，后逐渐演变为州牧、地方最高行政长官。'}
     ],books:[{name:'史记',author:'司马迁',period:'西汉武帝时',life:'前145—约前87',desc:'中国第一部纪传体通史，130篇，被鲁迅誉为「史家之绝唱，无韵之离骚」。'},{name:'淮南子',author:'刘安集门客',period:'西汉文帝时',life:'刘安（前179—前122）集门客',desc:'杂家代表作，保存大量上古神话与哲学思想。'},{name:'战国策',author:'刘向编订',period:'西汉成帝时',life:'刘向（约前77—前6）编订',desc:'战国纵横家言论汇编，文学性极强。'}]},

     stories:[

       {name:'不入虎穴焉得虎子',tag:'正史',type:'military',era:'班超·73年',desc:'班超出使鄯善，察觉匈奴使者也在，率三十六人夜袭匈奴营，说"不入虎穴不得虎子"。是勇敢果决的经典。'},

       {name:'挟天子以令诸侯',tag:'正史',type:'politics',era:'曹操/荀彧·196年',desc:'曹操采纳荀彧建议迎献帝都许，以朝廷名义发号施令，在政治上占得先机。是曹魏代汉的基础策略。'},

       {name:'鸦片战争',tag:'正史',type:'military',era:'道光·1840年',desc:'1840年英国以林则徐虎门销烟为借口发动战争，清军战败签《南京条约》割香港。是中国近代史的开端。'},
       {name:'改土归流',tag:'正史',type:'politics',era:'雍正·1726年起',desc:'雍正朝在西南少数民族地区废除世袭土司，改行中央任命的流官。加强了中央对西南边疆的直接管辖，促进了民族融合，但也伴随军事镇压。'},
       {name:'闭关锁国',tag:'正史',type:'econ',era:'乾隆后·1757年起',desc:'乾隆以后仅留广州一口通商，由十三行垄断对外贸易，严格限制洋人来华与国人出海。这种政策在西方工业革命后严重落后，最终被鸦片战争强行打破。'},
       {name:'戊戌变法',tag:'正史',type:'politics',era:'光绪/康有为·1898年',desc:'1898年光绪帝支持康有为、梁启超推行新政一百零三天，被慈禧发动政变扼杀。谭嗣同等六君子就义。'},
       {name:'辛亥革命',tag:'正史',type:'politics',era:'孙中山·1911年',desc:'1911年10月10日武昌起义，各省响应。1912年1月1日中华民国成立，2月12日清帝退位，两千余年帝制终结。'}
     ],books:[{name:'红楼梦',author:'曹雪芹',period:'清乾隆时',life:'约1715—1763',desc:'中国古典小说巅峰，四大之首，百科全书式世情小说。'},{name:'四库全书',author:'纪昀等编',period:'清乾隆时',life:'纪昀（1724—1805）等编',desc:'中国最大丛书，收书3503种，79337卷。'},{name:'聊斋志异',author:'蒲松龄',period:'清康熙时',life:'1640—1715',desc:'文言短篇小说巅峰，借鬼狐讽世。'},{name:'儒林外史',author:'吴敬梓',period:'清乾隆时',life:'1701—1754',desc:'中国长篇讽刺小说开山之作。'},{name:'康熙字典',author:'张玉书等',period:'清康熙时',life:'张玉书（1642—1711）等编',desc:'中国第一部字典，收字47035个。'},{name:'海国图志',author:'魏源',period:'清道光时',life:'1794—1857',desc:'近代开眼看世界第一书，提出「师夷长技以制夷」。'}]}
  ]
;
})();
</script>
<script>
(function(){
  var rows=ROWS_DATA;
  var colName=document.getElementById('colName');
  var colInner=document.getElementById('colInner');
  var rowsEl=document.getElementById('rows');
  var overlay=document.getElementById('overlay');
  var colScroll=document.getElementById('colScroll');
  var currentMobilePanel=null;
  function isMobile(){ return window.innerWidth<=640; }

  // AD year divider
  var divider=document.createElement('div');
  divider.className='year-divider'; divider.style.left=P(0)+'px';
  colInner.appendChild(divider);
  var dividerLabel=document.createElement('div');
  dividerLabel.className='year-divider-label'; dividerLabel.style.left=P(0)+'px';
  dividerLabel.textContent='公元元年';
  var refs=[-2000,-1000,1000];
  for(var ri=0;ri<refs.length;ri++){
    (function(yr){
      var rl=document.createElement('div'); rl.className='ref-line'; rl.style.left=P(yr)+'px'; colInner.appendChild(rl);
      var rlt=document.createElement('div'); rlt.className='ref-line-label'; rlt.style.left=P(yr)+'px'; rlt.textContent=(yr<0?'前'+(-yr):yr)+'年'; colInner.appendChild(rlt);
    })(refs[ri]);
  }
  colInner.appendChild(dividerLabel);

  function closeAll(){
    if(currentMobilePanel){ colInner.appendChild(currentMobilePanel); currentMobilePanel=null; }
    var ps=colInner.querySelectorAll('.panel');
    for(var i=0;i<ps.length;i++) ps[i].classList.remove('open');
    var rs=colInner.querySelectorAll('.dyn-row');
    for(var j=0;j<rs.length;j++) rs[j].classList.remove('active');
    overlay.classList.remove('show');
    document.body.classList.remove('locked');
  }
  overlay.addEventListener('click', closeAll);

  for(var r=0;r<rows.length;r++){
    (function(d){
      var nameEl=document.createElement('div');
      nameEl.style.height='38px'; nameEl.style.lineHeight='38px'; nameEl.textContent=d.n;
      nameEl.style.fontSize='12px'; nameEl.style.fontWeight='600'; nameEl.style.textAlign='right';
      nameEl.style.paddingRight='8px'; nameEl.style.background='#FBFAF7';
      colName.appendChild(nameEl);

      var row=document.createElement('div'); row.className='dyn-row';
      var bar=document.createElement('div'); bar.className='dyn-bar';
      bar.style.left=P(d.s)+'px';
      var wPx=P(d.e)-P(d.s); if(wPx<3) wPx=3;
      bar.style.width=wPx+'px'; bar.style.background=d.c;
      row.appendChild(bar);

      var lab=document.createElement('div'); lab.className='dyn-bar-label';
      lab.style.left=P(d.s)+'px';
      lab.textContent=fmtRange(d.s,d.e)+' · '+d.years;
      row.appendChild(lab);

      var panel=document.createElement('div'); panel.className='panel';
      var h='<div class="panel-close">×</div><div class="panel-head">';
      h+='<h2>'+d.n+'<span class="badge" style="background:'+d.c+'">'+d.years+' · '+fmtRange(d.s,d.e)+'</span></h2>';
      h+='<div class="meta"><b>都城：</b>'+d.cap+'</div></div><div class="panel-body">';
      h+='<div style="color:#666;font-size:12.5px;margin-bottom:8px;">'+d.meta+'</div>';
      h+='<div class="rulers"><b style="color:#B5485F;">君主世系（自上而下顺序）：</b>';
      for(var k=0;k<d.rulers.length;k++){
        var ru=d.rulers[k];
        h+='<div class="ruler'+(ru.note?' collapsed':'')+'">';
        h+='<div class="ruler-name">'+ru.name+'<span class="reign">'+ru.reign+'</span></div>';
        h+='<div class="ruler-deeds">'+ru.deeds+'</div>';
        if(ru.note) h+='<div class="ruler-note">'+ru.note+'</div>';
        h+='</div>';
      }
      h+='</div>';
      if(d.books && d.books.length){
        h+='<div class="section"><div class="section-title">经典著作</div>';
        for(var b=0;b<d.books.length;b++){
          var bk=d.books[b];
          h+='<div style="margin:5px 0;padding:5px 8px;background:#fafafa;border-radius:6px;"><div style="font-weight:600;color:#1A1B1C;">《'+bk.name+'》</div><div style="font-size:11px;color:#888;margin:2px 0;">'+bk.author+(bk.life?'（'+bk.life+'）':'')+(bk.period?' · '+bk.period:'')+'</div><div style="font-size:12.5px;color:#555;line-height:1.5;margin-top:3px;">'+bk.desc+'</div></div>';
        }
        h+='</div>';
      }
      if(d.stories && d.stories.length){
        h+='<div class="section"><div class="section-title">典故与成语（点击展开）</div>';
        for(var s=0;s<d.stories.length;s++){
          var st=d.stories[s];
          h+='<div class="story"><div class="story-line"><span class="story-arrow">▶</span><span class="story-name">'+st.name+'</span>'+tagHtml(st.tag);
      if(st.type){ var TC={'politics':'政治制度','military':'军事战争','econ':'经济政策','culture':'文化思想','idiom':'典故成语'}; h+='<span class="story-type t-'+st.type+'">'+TC[st.type]+'</span>'; }
      if(st.era){ h+='<span class="story-meta">'+st.era+'</span>'; }
      h+='</div>';
          h+='<div class="story-desc">'+st.desc+'</div></div>';
        }
        h+='</div>';
      }
      h+='</div>';
      panel.innerHTML=h;

      panel.querySelector('.panel-close').addEventListener('click', function(e){
        e.stopPropagation(); closeAll(); row.classList.remove('active');
      });
      var storyEls=panel.querySelectorAll('.story');
      storyEls.forEach(function(se){
        se.addEventListener('click', function(){ se.classList.toggle('open'); });
      });

      row.addEventListener('click',function(e){
        e.stopPropagation();
        if(panel.classList.contains('open')){
          closeAll(); row.classList.remove('active');
        } else {
          closeAll();
          panel.classList.add('open'); row.classList.add('active');
          if(isMobile()){
            document.body.appendChild(panel);
            currentMobilePanel=panel;
            overlay.classList.add('show');
            document.body.classList.add('locked');
            setTimeout(function(){ panel.scrollTop=0; }, 50);
          }
        }
      });

      rowsEl.appendChild(row);
      colInner.appendChild(panel);
    })(rows[r]);
  }
})();
</script>
</body>
</html>
